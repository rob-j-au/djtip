# Kargo - Progressive Delivery Configuration for djtip
# =====================================================
# This deploys Kargo alongside ArgoCD to manage multi-stage promotion pipelines.
# See: https://docs.kargo.io
#
# NOTE: All settings are nested under `kargo:` because the upstream Kargo chart
# is pulled in as a Helm dependency of this wrapper chart.

kargo:
  # -- Kargo API server
  api:
    host: kargo.minikube.local
    adminAccount:
      # bcrypt hash of "admin" - same as default ArgoCD admin password
      passwordHash: $2a$10$5vm8wXaSdbuff0m9l21JdevzXBzJFPCi8sy6OOnpZMAG.fOXL7jvO
      tokenSigningKey: djtip-kargo-token-signing-key-change-me
    service:
      type: NodePort
      nodePort: 31081
    tls:
      enabled: false
    logLevel: info

  # -- Webhooks server (for external webhook integrations)
  externalWebhooksServer:
    service:
      type: NodePort
      nodePort: 31082
    tls:
      enabled: false

  # -- ArgoCD integration
  argocd:
    namespace: argocd

  # -- Kargo controller
  controller:
    logLevel: info

  # -- Internal Kubernetes webhooks server (disable self-signed cert to avoid cert-manager dependency)
  webhooksServer:
    tls:
      selfSignedCert: false

  # -- Install Kargo CRDs
  crds:
    install: true
    keep: true

  # -- Kargo resources deployed via extraObjects
  # These define the promotion pipeline for the djtip application
  extraObjects:
    # =============================================
    # Project: djtip
    # Creates a namespace named djtip
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: Project
      metadata:
        name: djtip

    # =============================================
    # ProjectConfig: djtip
    # Defines promotion policies for the project
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: ProjectConfig
      metadata:
        name: djtip
        namespace: djtip
      spec:
        promotionPolicies:
          - stage: dev
            autoPromotionEnabled: true
          - stage: staging
            autoPromotionEnabled: true
          - stage: production
            autoPromotionEnabled: false

    # =============================================
    # Warehouse: djtip
    # Watches the Git repository for new commits
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: Warehouse
      metadata:
        name: djtip
        namespace: djtip
      spec:
        interval: 5m
        freightCreationPolicy: Automatic
        subscriptions:
          - git:
              repoURL: https://github.com/rob-j-au/djtip.git
              branch: main
              commitSelectionStrategy: NewestFromBranch

    # =============================================
    # Stage: dev
    # Development stage - auto-promotes from Warehouse
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: Stage
      metadata:
        name: dev
        namespace: djtip
      spec:
        requestedFreight:
          - origin:
              kind: Warehouse
              name: djtip
            sources:
              direct: true
        promotionTemplate:
          spec:
            steps:
              - uses: argocd-update
                as: dev-update
                retry:
                  timeout: 30m
                config:
                  apps:
                    - name: djtip-development
                      namespace: argocd
                      sources:
                        - repoURL: https://github.com/rob-j-au/djtip.git

    # =============================================
    # Stage: staging
    # Staging stage - promotes from dev after 5m soak time
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: Stage
      metadata:
        name: staging
        namespace: djtip
      spec:
        requestedFreight:
          - origin:
              kind: Warehouse
              name: djtip
            sources:
              stages:
                - dev
              requiredSoakTime: 5m
        promotionTemplate:
          spec:
            steps:
              - uses: argocd-update
                as: staging-update
                retry:
                  timeout: 30m
                config:
                  apps:
                    - name: djtip-staging
                      namespace: argocd
                      sources:
                        - repoURL: https://github.com/rob-j-au/djtip.git

    # =============================================
    # Stage: production
    # Production stage - manual promotion from staging after 30m soak time
    # =============================================
    - apiVersion: kargo.akuity.io/v1alpha1
      kind: Stage
      metadata:
        name: production
        namespace: djtip
      spec:
        requestedFreight:
          - origin:
              kind: Warehouse
              name: djtip
            sources:
              stages:
                - staging
              requiredSoakTime: 30m
        promotionTemplate:
          spec:
            steps:
              - uses: argocd-update
                as: production-update
                retry:
                  timeout: 30m
                config:
                  apps:
                    - name: djtip-production
                      namespace: argocd
                      sources:
                        - repoURL: https://github.com/rob-j-au/djtip.git

    # =============================================
    # Ingress: kargo
    # Routes kargo.minikube.local to the Kargo API server
    # =============================================
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: kargo
        namespace: kargo
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "false"
      spec:
        ingressClassName: traefik
        rules:
          - host: kargo.minikube.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: kargo-api
                      port:
                        number: 80

    # =============================================
    # Ingress: argocd
    # Routes argocd.minikube.local to the ArgoCD API server
    # =============================================
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd
        namespace: argocd
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "false"
      spec:
        ingressClassName: traefik
        rules:
          - host: argocd.minikube.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80
