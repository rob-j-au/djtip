# cert-manager configuration

# Let's Encrypt configuration
letsencrypt:
  email: "robert@jennings.au"  # Change this to your email

cert-manager:
  # Install CRDs
  installCRDs: true

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
