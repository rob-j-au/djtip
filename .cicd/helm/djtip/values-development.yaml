# Development environment overrides
# Inherits from values.yaml

# Development-specific ingress
ingress:
  hosts:
    - host: app.dev.djtip.jennings.au
      paths:
        - path: /
          pathType: ImplementationSpecific

# Development secrets (safe defaults for local dev)
# Override these in production via values-staging.yaml / values-production.yaml
secrets:
  SECRET_KEY_BASE: "dummy-secret-key-for-development"
  DEVISE_JWT_SECRET_KEY: "dummy-jwt-secret-for-development"
