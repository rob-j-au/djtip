{{- if .Values.sidekiqIngress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "djtip.fullname" . }}-sidekiq
  labels:
    {{- include "djtip.labels" . | nindent 4 }}
    app.kubernetes.io/component: sidekiq-web
  annotations:
    # Rewrite / to /sidekiq so the Rails app serves the Sidekiq Web UI
    traefik.ingress.kubernetes.io/rewrite-target: /sidekiq
    {{- with .Values.sidekiqIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.sidekiqIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.sidekiqIngress.tls }}
  tls:
    {{- range .Values.sidekiqIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.sidekiqIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "djtip.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}