{{- if .Values.mongoExpress.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "djtip.fullname" . }}-mongo-express
  labels:
    {{- include "djtip.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo-express
  annotations:
    {{- with .Values.mongoExpress.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.mongoExpress.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.mongoExpress.ingress.tls }}
  tls:
    {{- range .Values.mongoExpress.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.mongoExpress.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "djtip.fullname" $ }}-mongo-express
                port:
                  number: {{ $.Values.mongoExpress.service.port }}
          {{- end }}
    {{- end }}
{{- end }}