{{- if .Values.mongoExpress.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "djtip.fullname" . }}-mongo-express
  labels:
    {{- include "djtip.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo-express
spec:
  type: {{ .Values.mongoExpress.service.type }}
  ports:
    - port: {{ .Values.mongoExpress.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "djtip.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongo-express
{{- end }}