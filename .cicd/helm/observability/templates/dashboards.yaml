apiVersion: v1
kind: ConfigMap
metadata:
  name: djtip-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: djtip
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application-logs.json: |
{{ .Files.Get "dashboards/application-logs.json" | indent 4 }}
  traefik-official.json: |
{{ .Files.Get "dashboards/traefik-official.json" | indent 4 }}