apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/rob-j-au/djtip.git
    targetRevision: main
    path: .cicd/helm/kargo
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: api.host
          value: "kargo.k8s.pi.jennings.au"
        - name: api.service.type
          value: "ClusterIP"
        - name: api.tls.enabled
          value: "false"
        - name: externalWebhooksServer.service.type
          value: "ClusterIP"
        - name: externalWebhooksServer.tls.enabled
          value: "false"

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true  # Required for CRDs

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
